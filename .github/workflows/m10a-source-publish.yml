name: Preserve reviewed M10a source
on:
  push:
    branches: [codex/task-grounded-execution-20260928]
    paths: [.github/workflows/m10a-source-publish.yml]
permissions:
  contents: write
concurrency:
  group: m10a-reviewed-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/task-grounded-execution-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact source patch and preserve without running model code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess
          def git(*args, **kw):
              return subprocess.check_output(['git', *args], **kw)
          branch = 'codex/task-grounded-execution-20260928'
          base = 'b58a3a0f7c6355c02b7c7fbf3916443a3ab7d9c9'
          expected = '9da55a749f4667461da4c953cf93814c29ef29ca'
          workflow = '.github/workflows/m10a-source-publish.yml'
          payload = '.github/m10a-source/changes.patch.xz.b64'
          transport = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF'] == 'refs/heads/'+branch
          assert git('rev-parse','HEAD',text=True).strip() == transport
          assert git('rev-parse','HEAD^',text=True).strip() == base
          assert git('rev-parse',base+'^{tree}',text=True).strip() == 'd4a4cc440380fa0a29d0c2e1d18b940bc8a23947'
          assert not git('status','--porcelain',text=True).strip()
          assert set(git('diff','--name-only',base,'HEAD',text=True).splitlines()) == {payload,workflow}
          encoded = pathlib.Path(payload).read_bytes()
          assert len(encoded) == 12728
          decoder = lzma.LZMADecompressor(memlimit=64*1024*1024)
          patch = decoder.decompress(base64.b64decode(encoded,validate=True),max_length=1000000)
          assert decoder.eof and not decoder.unused_data and len(patch) == 31922
          assert hashlib.sha256(patch).hexdigest() == '197ead2f24ccb637cb974760ee03e58f4bea2133b983c814b302422d6f076041'
          paths = set()
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  _,_,left,right = line.split()
                  assert left.startswith('a/') and right == 'b/'+left[2:]
                  paths.add(left[2:])
          assert paths == {'clearvla/mainline/data/loading.py','scripts/audit_calvin_history_support.py','tests/test_mainline_cumulative_data_entry.py','docs/research/00_CURRENT_ARCHITECTURE_CONTRACT.md','docs/research/CURRENT_MAINLINE_REPAIR_PLAN.md'}
          git('apply','--check','--index','-',input=patch)
          git('apply','--index','-',input=patch)
          git('rm','--',payload)
          index = pathlib.Path(git('rev-parse','--git-path','index',text=True).strip()).resolve()
          clean = pathlib.Path(os.environ['RUNNER_TEMP'])/'m10a-clean.index'
          shutil.copyfile(index,clean)
          env = dict(os.environ,GIT_INDEX_FILE=str(clean))
          git('rm','--cached','--',workflow,env=env)
          assert git('write-tree',env=env,text=True).strip() == expected
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(M10a): restore endpoint provenance on selected training windows\n\nVerified source tree '+expected+'. Actual disk entry, 7D/10D online parity, history-support census and disk-to-engine tests preserved. Publication verifies source only; local test logs remain in the delivery archive. No trained closed-loop claim. Temporary publisher removed separately.')
          remote = git('ls-remote','--heads','origin','refs/heads/'+branch,text=True).split()[0]
          assert remote == transport, 'Concurrent branch change; refuse to overwrite'
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Preserved reviewed source',expected)
          PY
