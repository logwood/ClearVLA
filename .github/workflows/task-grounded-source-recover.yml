name: Recover interrupted task-grounded source
on:
  push:
    branches: [codex/task-grounded-execution-20260928]
    paths: [.github/workflows/task-grounded-source-recover.yml]
permissions:
  contents: write
concurrency:
  group: task-grounded-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/task-grounded-execution-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify and preserve source without executing model code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, shutil, subprocess
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          branch = 'codex/task-grounded-execution-20260928'
          base = '4a7faafbbed42d512a8c015f6251e41e662d1287'
          expected = 'a39ca95ebc689299871470d9924a46aec4da3a26'
          workflow = '.github/workflows/task-grounded-source-recover.yml'
          transport = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF'] == 'refs/heads/'+branch
          assert git('rev-parse','HEAD^',text=True).strip() == base
          assert not git('status','--porcelain',text=True).strip()
          parts = [f'.github/task-grounded-source/part-{i:02d}.txt' for i in range(9)]
          assert set(git('diff','--name-only',base,'HEAD',text=True).splitlines()) == set(parts+[workflow])
          encoded = b''.join(pathlib.Path(p).read_bytes() for p in parts)
          assert len(encoded) == 33000
          d = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = d.decompress(base64.b64decode(encoded,validate=True),max_length=2000000)
          assert d.eof and not d.unused_data
          assert len(patch) == 123859
          assert hashlib.sha256(patch).hexdigest() == 'e9d26fcc97cf7d6b72f99df36cdcf195e87a4d90e4a1ec9b6fb5965d32d3ddb6'
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  _,_,a,b = line.split()
                  assert a.startswith('a/') and b == 'b/'+a[2:]
                  p = pathlib.PurePosixPath(a[2:])
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in {'clearvla','tests','configs','docs'}
          git('apply','--check','--index','-',input=patch)
          git('apply','--index','-',input=patch)
          git('rm','--',*parts)
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'task-grounded-recovered'
          out.mkdir()
          index = pathlib.Path(git('rev-parse','--git-path','index',text=True).strip()).resolve()
          clean = out/'clean.index'
          shutil.copyfile(index,clean)
          env = dict(os.environ,GIT_INDEX_FILE=str(clean))
          git('rm','--cached','--',workflow,env=env)
          tree = git('write-tree',env=env,text=True).strip()
          assert tree == expected
          out.joinpath('changes.patch').write_bytes(patch)
          git('archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),tree)
          out.joinpath('identity.json').write_text(json.dumps({'base':base,'source_tree':tree,'patch_sha256':hashlib.sha256(patch).hexdigest(),'status':'recovered source; validation pending'},indent=2)+'\n')
          clean.unlink()
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','wip(M9c/M9d): preserve recovered joint task-scene execution candidate\n\nRecovered interrupted source by exact patch hash and source tree. Validation is pending; this is not trained behavior acceptance. Temporary recovery workflow will be removed separately.')
          remote = git('ls-remote','--heads','origin','refs/heads/'+branch,text=True).split()[0]
          assert remote == transport, 'branch changed; refusing to overwrite concurrent work'
          git('push','origin','HEAD:refs/heads/'+branch)
          out.joinpath('source_commit.txt').write_text(git('rev-parse','HEAD',text=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-grounded-recovered-source
          path: ${{ runner.temp }}/task-grounded-recovered
          retention-days: 14
