name: Unified complementary regression
on:
  push:
    branches: [codex/causal-unified-refactor-20261008]
    paths: [.github/workflows/unified-adapter-regression.yml]
permissions:
  contents: read
jobs:
  remaining-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15' 'opencv-python-headless>=4.9,<5' 'scipy>=1.11,<2' 'matplotlib>=3.8,<4' 'ruff==0.16.0' 'pyright==1.1.411'
      - name: Run every tracked test file outside the primary regression inventory
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,sys,json,subprocess
          root=Path.cwd()
          sys.path.insert(0,str(root/'scripts'))
          from run_unified_refactor_checks import PATTERNS
          from run_structural_tests import run_inventory
          primary={p.relative_to(root).as_posix() for pattern in PATTERNS for p in (root/'tests').glob(pattern)}
          tracked=subprocess.check_output(['git','ls-files','*test_*.py'],text=True).splitlines()
          remaining=sorted(set(tracked)-primary)
          shard=int(os.environ['SHARD']); files=remaining[shard::4]
          out=Path(os.environ['RUNNER_TEMP'])/'complement'
          out.mkdir()
          (out/'inventory.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'all_tracked':tracked,'primary':sorted(primary),'complement':remaining,'shard':shard,'files':files,'scope':'synthetic/recorded fixture regressions; missing external assets are not silently manufactured'},indent=2))
          raise SystemExit(run_inventory(root,files,out,'complement',900))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-complement-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/complement
          retention-days: 14
