name: Prepare reviewed integration

on:
  push:
    branches: [codex/integrated-mainline-20260917]
    paths: [integration-review.patch.json]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/integrated-mainline-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source and disclosure patches
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, subprocess, urllib.request
          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'integration-reviewed-tree'
          evidence.mkdir()
          manifest = json.loads((root / 'integration-review.patch.json').read_text())
          def blob(sha):
              if not re.fullmatch('[0-9a-f]{40}', sha):
                  raise ValueError('invalid blob identity')
              request = urllib.request.Request('https://api.github.com/repos/logwood/ClearVLA/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_OBJECT_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              data = base64.b64decode(value['content'])
              digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if digest != sha or len(data) > 1000000:
                  raise ValueError('patch object differs')
              return data
          for field in ('base_commit', 'expected_tree_sha', 'initial_tree_sha'):
              if not re.fullmatch('[0-9a-f]{40}', manifest[field]):
                  raise ValueError('invalid source identity')
          subprocess.run(['git','merge-base','--is-ancestor',manifest['base_commit'],'HEAD'],check=True)
          shas = manifest['patch_blob_shas']
          if not 1 <= len(shas) <= 8:
              raise ValueError('invalid blob count')
          decoder = lzma.LZMADecompressor()
          patch = decoder.decompress(b''.join(blob(sha) for sha in shas), max_length=1000000)
          if not decoder.eof or hashlib.sha256(patch).hexdigest() != manifest['patch_sha256']:
              raise ValueError('patch digest differs')
          def apply(data, name):
              path = evidence / name
              path.write_bytes(data)
              subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
              subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          apply(patch,'requested.patch')
          (root / 'integration-review.patch.json').unlink()
          (root / '.github/workflows/integration-prepare.yml').unlink()
          subprocess.run(['git','add','--all'],check=True)
          if subprocess.check_output(['git','write-tree'],text=True).strip() != manifest['initial_tree_sha']:
              raise ValueError('initial reviewed tree differs')
          apply(blob(manifest['supplemental_blob_sha']), 'supplemental.patch')
          subprocess.run(['git','add','--all'],check=True)
          actual = subprocess.check_output(['git','write-tree'],text=True).strip()
          if actual != manifest['expected_tree_sha']:
              raise ValueError('final reviewed tree differs')
          (evidence/'request.json').write_text(json.dumps(manifest,indent=2))
          print('Verified exact candidate tree:', actual)
          PY
      - name: Install recorded CPU review environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.11,<2.12'
          python -m pip install 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'pytest>=8,<10' 'rich>=13,<15' 'ruff>=0.8,<1'
          python -m pip freeze > "$RUNNER_TEMP/integration-reviewed-tree/test-environment.txt"
      - name: Validate source without changing it
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=AM','-z']).decode().split('\0')
          subprocess.run(['ruff','check',*[p for p in paths if p.endswith('.py')]],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          python -m compileall -q clearvla scripts tests
      - name: Collect strict tests and baseline attribution without suppressing failures
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'])/'integration-reviewed-tree'
          report = {}
          def run(name, command, cwd):
              xml = evidence/(name+'.xml')
              result = subprocess.run([*command,'--junitxml='+str(xml)],cwd=cwd)
              tree = ET.parse(xml)
              suites = list(tree.iter('testsuite'))
              counts = {k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
              failures = [{'test':t.get('classname')+'.'+t.get('name'), 'detail':t.find('failure').text}
                          for t in tree.iter('testcase') if t.find('failure') is not None]
              counts.update(returncode=result.returncode, failed_cases=failures)
              report[name] = counts
              (evidence/'strict-results.json').write_text(json.dumps(report,indent=2))
          run('mainline',['python','scripts/check_integration.py','--suite','mainline'],root)
          run('numerics',['python','scripts/check_integration.py','--suite','numerics'],root)
          baseline = pathlib.Path(os.environ['RUNNER_TEMP'])/'original-baseline'
          subprocess.run(['git','worktree','add','--detach',str(baseline),'d7ebf00ed4b0041294c5ca44350c6ce79f8e782b'],check=True)
          names = ['test_prepared_block_contexts_preserve_training_update_exactly','test_experimental_vmap_block_bank_matches_individual_blocks']
          run('baseline_acceleration',['python','-m','pytest','-q',*['tests/test_training_acceleration_prefix_reuse.py::'+n for n in names]],baseline)
          print(json.dumps(report,indent=2))
          PY
      - name: Create review-only tree; known failures remain release blockers
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'])/'integration-reviewed-tree'
          request = json.loads((evidence/'request.json').read_text())
          results = json.loads((evidence/'strict-results.json').read_text())
          known = {'tests.test_training_acceleration_prefix_reuse.test_prepared_block_contexts_preserve_training_update_exactly',
                   'tests.test_training_acceleration_prefix_reuse.test_experimental_vmap_block_bank_matches_individual_blocks'}
          failed = {x['test'] for x in results['mainline']['failed_cases']}
          if failed - known or results['mainline']['errors'] or results['mainline']['tests'] != 535:
              raise RuntimeError('unexpected failures; do not create a review tree')
          if results['mainline']['returncode'] not in (0,1) or results['numerics']['returncode'] != 0 or results['numerics']['tests'] != 111:
              raise RuntimeError('incomplete test evidence; do not create a review tree')
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def post(path, body):
              req = urllib.request.Request('https://api.github.com/repos/logwood/ClearVLA/'+path,
                  data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_OBJECT_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.load(response)
          if git('write-tree') != request['expected_tree_sha']:
              raise ValueError('tested tree changed')
          records = subprocess.check_output(['git','diff','--cached','--name-status','--no-renames','-z']).decode().split('\0')
          entries = []
          for index in range(0,len(records)-1,2):
              status,path = records[index:index+2]
              if status == 'D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              if status not in {'A','M'}:
                  raise ValueError('unexpected source operation')
              mode,sha = git('ls-files','--stage','--',path).split()[:2]
              data = subprocess.check_output(['git','cat-file','blob',sha])
              if post('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha'] != sha:
                  raise ValueError('uploaded source differs')
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          actual = post('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']
          if actual != request['expected_tree_sha']:
              raise ValueError('uploaded tree differs')
          report = {'tree_sha':actual,'prepared_from_commit':git('rev-parse','HEAD'),'base_commit':request['base_commit'],
                    'branch_refs_updated':False,'release_status':'BLOCKED' if failed else 'CPU_ONLY',
                    'strict_results':results,'paths':[x['path'] for x in entries]}
          (evidence/'ready.json').write_text(json.dumps(report,indent=2)+'\n')
          (evidence/'ready.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index',request['base_commit']]))
          print('Review tree:',actual,'Release:',report['release_status'])
          PY
      - name: Upload complete review evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-integration-${{ github.sha }}
          path: ${{ runner.temp }}/integration-reviewed-tree/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve failed regression status; never report a blocked candidate as green
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'integration-reviewed-tree'/'ready.json'
          if not path.is_file():
              raise SystemExit(1)
          report = json.loads(path.read_text())
          if report['release_status'] == 'BLOCKED':
              print('Strict acceleration regressions failed. Draft source review only; no release or master merge.')
              raise SystemExit(1)
          PY
