name: Preserve and test online DINOv3 integration
on:
  push:
    branches: [codex/dinov3-online-aligned-vision-20260928]
    paths: [.github/workflows/dinov3-integration-publish.yml]
permissions:
  contents: write
concurrency:
  group: dinov3-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/dinov3-online-aligned-vision-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Preserve exact source before testing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess
          def git(*a, **kw): return subprocess.check_output(['git', *a], **kw)
          branch='codex/dinov3-online-aligned-vision-20260928'
          base='96733915f786379b6982515c6fb688e180cfc010'
          expected='73ad609ae9b2e5e3fb7e38c7f1d32c7c1378425b'
          workflow='.github/workflows/dinov3-integration-publish.yml'
          transport=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert git('rev-parse','HEAD',text=True).strip()==transport
          assert git('rev-parse','HEAD^',text=True).strip()==base
          assert git('rev-parse',base+'^{tree}',text=True).strip()=='8769a56e5ee0766da2b8e4ea33aeb0a57f4a2766'
          assert not git('status','--porcelain',text=True).strip()
          parts=[f'.github/dinov3-integration-source/part-{i}.txt' for i in range(7)]
          assert set(git('diff','--name-only',base,'HEAD',text=True).splitlines())==set(parts+[workflow])
          data=b''.join(pathlib.Path(p).read_bytes() for p in parts)
          assert len(data)==39772
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch=decoder.decompress(base64.b64decode(data,validate=True),max_length=1000000)
          assert decoder.eof and not decoder.unused_data and len(patch)==133777
          assert hashlib.sha256(patch).hexdigest()=='6290b29077de47eb5702c2f58795e4e87e0956b09f2293ea7c787507f3e6d367'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  _,_,a,b=line.split()
                  assert a.startswith('a/') and b=='b/'+a[2:]
                  p=pathlib.PurePosixPath(a[2:])
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in {'clearvla','tests','scripts','configs','docs'}
          git('apply','--check','--index','-',input=patch)
          git('apply','--index','-',input=patch)
          git('rm','--',*parts)
          index=pathlib.Path(git('rev-parse','--git-path','index',text=True).strip()).resolve()
          clean=pathlib.Path(os.environ['RUNNER_TEMP'])/'dinov3-clean.index'
          shutil.copyfile(index,clean)
          env=dict(os.environ,GIT_INDEX_FILE=str(clean))
          git('rm','--cached','--',workflow,env=env)
          assert git('write-tree',env=env,text=True).strip()==expected
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(M10b): online DINOv3 training and deployment with aligned per-camera evidence\n\nExact reviewed source tree '+expected+'. No offline token-store dependency on the new opt-in path. Unified full-RGB raster, strict ABI, source-time supervision separation, per-camera values, real deployment adapter acceptance entry. Source preserved before CI; test outcome recorded separately. No pretrained or learned robot success claim.')
          assert git('ls-remote','--heads','origin','refs/heads/'+branch,text=True).split()[0]==transport
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Preserved source tree',expected)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported CPU test environment
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy<3' 'pillow<13' 'h5py<4' transformers==4.57.6 safetensors
          mkdir -p ci-results
          python -m pip freeze > ci-results/environment.txt
          git rev-parse HEAD > ci-results/tested-commit.txt
      - name: Online data train update resume and actual deployment adapter
        id: production
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/test_dinov3_production_integration.py -q --junitxml=ci-results/production.xml 2>&1 | tee ci-results/production.log
      - name: Encoder coordinates and per-camera contracts
        id: contracts
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/test_dinov3_online.py tests/test_dinov3_multiview.py -q --junitxml=ci-results/contracts.xml 2>&1 | tee ci-results/contracts.log
      - name: Actual HF architecture and strict safetensors interface - random weights not pretrained
        id: hf
        continue-on-error: true
        env:
          CLEARVLA_TEST_HF_DINOV3: '1'
        run: |
          set -o pipefail
          python -m pytest tests/test_dinov3_hf_loader.py -q --junitxml=ci-results/hf.xml 2>&1 | tee ci-results/hf.log
      - name: Related existing regression tests
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/test_mainline_config.py tests/test_mainline_checkpoint.py tests/test_mainline_cumulative_data_entry.py tests/test_mainline_task_execution.py tests/test_mainline_task_execution_boundaries.py tests/test_mainline_task_execution_cumulative.py tests/test_mainline_task_execution_language_values.py -q --junitxml=ci-results/regression.xml 2>&1 | tee ci-results/regression.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dinov3-integration-source-tests
          path: ci-results
          retention-days: 14
      - name: Require completed tests
        if: always()
        env:
          PRODUCTION: ${{ steps.production.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          HF: ${{ steps.hf.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          test "$PRODUCTION" = success
          test "$CONTRACTS" = success
          test "$HF" = success
          test "$REGRESSION" = success
