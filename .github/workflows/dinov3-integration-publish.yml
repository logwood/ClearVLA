name: Complete DINOv3 formal CLI acceptance
on:
  push:
    branches: [codex/dinov3-online-aligned-vision-20260928]
    paths: [.github/workflows/dinov3-integration-publish.yml]
permissions:
  contents: write
concurrency:
  group: dinov3-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/dinov3-online-aligned-vision-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Preserve reviewed CLI source before acceptance
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,shutil,subprocess
          def git(*a,**kw):return subprocess.check_output(['git',*a],**kw)
          branch='codex/dinov3-online-aligned-vision-20260928'
          base='dc7db7732a46a8c8b1ad8b168461accc4680f334'
          workflow='.github/workflows/dinov3-integration-publish.yml'
          payload='.github/dinov3-cli-source.patch'
          transport=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert git('rev-parse','HEAD^',text=True).strip()==base
          assert set(git('diff','--name-only',base,'HEAD',text=True).splitlines())=={workflow,payload,'tests/test_dinov3_training_cli.py'}
          patch=pathlib.Path(payload).read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='56eb6a0df3fb48699769229d903a598c09dd6f15da909d7c5fcb1504f94c5398'
          git('apply','--check','--index','-',input=patch)
          git('apply','--index','-',input=patch)
          git('rm','--',payload)
          index=pathlib.Path(git('rev-parse','--git-path','index',text=True).strip()).resolve()
          clean=pathlib.Path(os.environ['RUNNER_TEMP'])/'cli-clean.index'
          shutil.copyfile(index,clean)
          env=dict(os.environ,GIT_INDEX_FILE=str(clean))
          git('rm','--cached','--',workflow,env=env)
          assert git('write-tree',env=env,text=True).strip()=='a788f5ac0b144a0f9dc1a969b23c8cd8efd27784'
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','test(M10b): formal train-validation entry and explicit online encoder identity\n\nExact source tree a788f5ac0b144a0f9dc1a969b23c8cd8efd27784. Original data/model integration passed CPU production/adapter/HF interface tests in preceding run; this extends CLI acceptance. External encoder factory is an explicitly artificial marker; no pretrained behavior claim.')
          assert git('ls-remote','--heads','origin','refs/heads/'+branch,text=True).split()[0]==transport
          git('push','origin','HEAD:refs/heads/'+branch)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy<3' 'pillow<13' 'h5py<4'
          mkdir -p ci-results
          python -m pip freeze > ci-results/environment.txt
          git rev-parse HEAD > ci-results/tested-commit.txt
      - name: Formal mainline train and validate CLI
        id: cli
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/test_dinov3_training_cli.py -q --junitxml=ci-results/cli.xml 2>&1 | tee ci-results/cli.log
      - name: Runtime bridge sampling and state-source regressions
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/test_mainline_runtime.py tests/test_bridge_instruction_boundary.py tests/test_mainline_sampling_admission.py tests/test_mainline_state_features.py -q --junitxml=ci-results/runtime.xml 2>&1 | tee ci-results/runtime.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dinov3-formal-cli-acceptance
          path: ci-results
          retention-days: 14
      - name: Require completed acceptance
        if: always()
        env:
          CLI: ${{ steps.cli.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          test "$CLI" = success
          test "$REGRESSION" = success
