name: DINOv3 layout fix and integration acceptance
on:
  push:
    branches: [codex/dinov3-online-aligned-vision-20260928]
    paths: [.github/workflows/dinov3-layout-acceptance.yml]
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Preserve exact reviewed fix before testing
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,subprocess
          def git(*a,**kw):return subprocess.check_output(['git',*a],**kw)
          branch='codex/dinov3-online-aligned-vision-20260928'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert git('rev-parse','HEAD^',text=True).strip()=='25761c89733cbf633b936611d83330a4219f0dab'
          p=pathlib.Path('.github/dinov3-layout-fix.patch')
          patch=p.read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='4a36d6088204f24b6d28613e2442ade7dcedc95f8fc630f13f3b1c57f96aa10b'
          git('apply','--check','--index','-',input=patch)
          git('apply','--index','-',input=patch)
          expected={'clearvla/mainline/model/restored_observation.py':'ab8dd7cdcccc0da27bd4c7135dc1da4a24b4fc3449d5538f85c159fcb4a59d65','clearvla/vision/online_pipeline.py':'05907e8d13690fcc231e8a00100ec61c37e161c9f9c21603343e7cdea8022a16','tests/test_dinov3_input_layout.py':'bb9274216fae48f13e0087c4303619ccb0193dc2d8f6764469136ff2cef64682'}
          for name,digest in expected.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest
          git('rm','--',str(p))
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(vision): canonicalize new visual ingress for exact deployment parity\n\nSource-confirmed equal values/weights but distinct tensor strides caused numerical drift. Preserve native values and gradient flow, canonicalize RGB/DINO ingress, export contiguous raster and record its identity. Legacy path and zero-tolerance test are unchanged. CPU validation follows; no pretrained/CUDA/robot success claim.')
          assert git('ls-remote','--heads','origin','refs/heads/'+branch,text=True).split()[0]==os.environ['GITHUB_SHA']
          git('push','origin','HEAD:refs/heads/'+branch)
          pathlib.Path('ci-results').mkdir()
          pathlib.Path('ci-results/tested-commit.txt').write_text(git('rev-parse','HEAD',text=True))
          git('archive','--format=tar.gz','--output=ci-results/source.tar.gz','HEAD')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install supported CPU test environment
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy<3' 'pillow<13' 'h5py<4' transformers==4.57.6 safetensors
          python -m pip freeze > ci-results/environment.txt
      - name: Run original and new acceptance without tolerance changes
        id: tests
        continue-on-error: true
        env:
          CLEARVLA_TEST_HF_DINOV3: '1'
        run: |
          python - <<'PY'
          import json, pathlib, subprocess,sys
          groups={
          'production':['tests/test_dinov3_production_integration.py'],
          'visual':['tests/test_dinov3_online.py','tests/test_dinov3_multiview.py','tests/test_dinov3_input_layout.py'],
          'hf':['tests/test_dinov3_hf_loader.py'],
          'cli':['tests/test_dinov3_training_cli.py'],
          'regression':['tests/test_mainline_config.py','tests/test_mainline_checkpoint.py','tests/test_mainline_cumulative_data_entry.py','tests/test_mainline_task_execution.py','tests/test_mainline_task_execution_boundaries.py','tests/test_mainline_task_execution_cumulative.py','tests/test_mainline_task_execution_language_values.py'],
          'runtime':['tests/test_mainline_runtime.py','tests/test_bridge_instruction_boundary.py','tests/test_mainline_sampling_admission.py','tests/test_mainline_state_features.py']}
          outcomes={}
          for name,paths in groups.items():
              with open('ci-results/'+name+'.log','w') as f:
                  p=subprocess.run([sys.executable,'-m','pytest',*paths,'-q','--junitxml=ci-results/'+name+'.xml'],stdout=f,stderr=subprocess.STDOUT)
              outcomes[name]=p.returncode
              print(name,p.returncode,pathlib.Path('ci-results/'+name+'.log').read_text()[-1000:],flush=True)
              pathlib.Path('ci-results/outcomes.json').write_text(json.dumps(outcomes,indent=2)+'\n')
          assert all(code==0 for code in outcomes.values()), outcomes
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dinov3-layout-integration-acceptance
          path: ci-results
          retention-days: 14
      - name: Require all groups passed
        if: always()
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: test "$OUTCOME" = success
