name: Structural rebuild audit

on:
  push:
    branches: [codex/structural-rebuild-20260921]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structural-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record immutable source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clearvla-audit"
          BASE=0f07160d692ec8c8302880420a3d93d74512c39b
          CONTROL=a0e1f5d5b9736d37a51faec36039144f181d4b12
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$CONTROL^{commit}"
          git archive --format=tar.gz "$BASE" > "$RUNNER_TEMP/clearvla-audit/baseline-source.tar.gz"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/clearvla-audit/current-source.tar.gz"
          git diff --stat "$CONTROL" "$BASE" > "$RUNNER_TEMP/clearvla-audit/heads-diff-stat.txt"
          git diff "$CONTROL" "$BASE" > "$RUNNER_TEMP/clearvla-audit/heads-diff.patch"
          git ls-tree -r "$BASE" > "$RUNNER_TEMP/clearvla-audit/baseline-tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/clearvla-audit/audited-head.txt"
          python --version > "$RUNNER_TEMP/clearvla-audit/python-version.txt" 2>&1
          python -m compileall -q clearvla tests
      - name: Package locked review tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download 'ruff==0.16.0' 'pyright==1.1.411' --dest "$RUNNER_TEMP/clearvla-audit/review-tools"
      - name: Run source-owned review when available
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/check_structural_rebuild.sh; then
            python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
            python -m pip install 'pytest==9.1.1' 'ruff==0.16.0' 'pyright==1.1.411' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15'
            bash scripts/check_structural_rebuild.sh "$RUNNER_TEMP/clearvla-audit"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: structural-audit-${{ github.sha }}
          path: ${{ runner.temp }}/clearvla-audit
          retention-days: 14
          if-no-files-found: error
