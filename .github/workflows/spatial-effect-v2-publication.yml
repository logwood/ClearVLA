name: Native spatial effect source acceptance
on:
  push:
    branches: [codex/integrated-spatial-adaptation-20260930]
    paths:
      - .github/spatial-effect-v2-publication.json
      - .github/spatial-effect-v2-payload/**
      - .github/workflows/spatial-effect-v2-publication.yml
permissions:
  contents: write
concurrency:
  group: spatial-effect-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate-and-test:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/integrated-spatial-adaptation-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TERM: dumb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed hash-locked source on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          d=json.loads(Path('.github/spatial-effect-v2-publication.json').read_text())
          assert d['base']=='f47c5263ed98e756065a4eaf872f06651c5189c8'
          assert d['branch']=='codex/integrated-spatial-adaptation-20260930'
          assert os.environ['GITHUB_REF']=='refs/heads/'+d['branch']
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor',d['base'],'HEAD'],check=True)
          extras=set(git('diff','--name-only',d['base'],'HEAD').splitlines())
          assert extras <= {'.github/spatial-effect-v2-publication.json','.github/workflows/spatial-effect-v2-publication.yml',*d['patch_parts']}, extras
          for path, record in d['files'].items():
              assert not Path(path).is_absolute() and '..' not in Path(path).parts
              assert path.startswith(('clearvla/mainline/','configs/mainline/','tests/','scripts/','docs/research/'))
              if record['before'] is None: assert not Path(path).exists(), path
              else: assert git('rev-parse','HEAD:'+path)==record['before'], path
          assert d['patch_parts']==[f'.github/spatial-effect-v2-payload/part{i}.b64' for i in range(4)]
          encoded=''.join(Path(p).read_text().strip() for p in d['patch_parts'])
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()==d['patch_sha256']
          p=Path(os.environ['RUNNER_TEMP'])/'reviewed-spatial-v2.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(d['files'])
          for path, record in d['files'].items():
              assert git('hash-object',path)==record['after'], path
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate contextual spatial expectations and paired task effects in native S/P2' -m 'Opt-in joint_spatial_effect_v2 on f47c5263. Preserve v1 forward, losses, DINOv3 reader/RoPE/layout, native action outlet and solver. Preserve task relations across object relabeling. Local compact FP32/BF16 and native-marker forward/adapter tests recorded separately; production-width/pretrained/CUDA/robot qualification is not claimed.'
          git push origin HEAD:refs/heads/codex/integrated-spatial-adaptation-20260930
          mkdir -p "$RUNNER_TEMP/spatial-v2-results"
          git rev-parse HEAD > "$RUNNER_TEMP/spatial-v2-results/source-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/spatial-v2-results/source.tar.gz"
      - name: Install repository-declared CPU validation environment
        run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest==9.1.1' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15' 'opencv-python-headless>=4.9,<5'
      - name: Independent-process original-graph parity
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/spatial-v2-baseline" f47c5263ed98e756065a4eaf872f06651c5189c8
          OUT="$RUNNER_TEMP/spatial-v2-results"
          python scripts/probe_spatial_effect_legacy_parity.py "$RUNNER_TEMP/spatial-v2-baseline" "$OUT/baseline-parity.json" > "$OUT/baseline-parity.log" 2>&1
          python scripts/probe_spatial_effect_legacy_parity.py "$GITHUB_WORKSPACE" "$OUT/candidate-parity.json" > "$OUT/candidate-parity.log" 2>&1
          cmp "$OUT/baseline-parity.json" "$OUT/candidate-parity.json"
          echo 'FP32/BF16 state_dict, relation, carrier, global, action and gripper hashes identical' > "$OUT/parity-result.txt"
      - name: Native policy and unchanged-regression tests
        run: bash scripts/check_spatial_effect_v2.sh "$RUNNER_TEMP/spatial-v2-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spatial-effect-v2-source-and-tests
          path: ${{ runner.temp }}/spatial-v2-results
          retention-days: 14
          if-no-files-found: error
