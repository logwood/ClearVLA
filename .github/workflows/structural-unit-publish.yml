name: Verify and publish M1c source unit
on:
  push:
    branches: [codex/structural-rebuild-20260921]
    paths: [.github/m1c-unit/manifest.json]
permissions:
  contents: write
concurrency:
  group: structural-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-publish:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/structural-rebuild-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply the exact M1c source delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1c-report"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm1c-report'
          out.joinpath('transport-head.txt').write_text(os.environ['GITHUB_SHA']+'\n')
          manifest_path = '.github/m1c-unit/manifest.json'
          workflow = '.github/workflows/structural-unit-publish.yml'
          manifest = json.loads(pathlib.Path(manifest_path).read_text())
          base = '12326a33bc33dad58603ddbb3cc48c892135b087'
          assert manifest['schema'] == 'verified-unit-patch-v1' and manifest['base'] == base
          assert manifest['base_tree'] == '632c4c0edd41c5adc22fca3a0fe9b41e64343f13'
          assert manifest['source_result_tree'] == '9a8b27fee31f51d20908231d3c8bcc3703311003'
          assert subprocess.check_output(['git','rev-parse',base+'^{tree}'],text=True).strip() == manifest['base_tree']
          assert len(manifest['parts']) == 6
          transport = [manifest_path]
          encoded = []
          for i, part in enumerate(manifest['parts']):
              path = f'.github/m1c-unit/part-{i:02d}.txt'
              assert part['path'] == path
              data = pathlib.Path(path).read_bytes()
              assert len(data) == part['length'] and len(data) <= 4000
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == part['blob_sha']
              encoded.append(data)
              transport.append(path)
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()) == set(transport+[workflow])
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(base64.b64decode(b''.join(encoded),validate=True),max_length=1000000)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == manifest['patch_bytes']
          assert hashlib.sha256(patch).hexdigest() == manifest['patch_sha256']
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  for name in line.split()[2:]:
                      path = pathlib.PurePosixPath(name)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert path.parts[0] in {'a','b'} and path.parts[1] in {'clearvla','tests','scripts','docs','configs'}
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','rm','--',*transport],check=True)
          subprocess.run(['git','add','--','clearvla','tests','scripts','docs','configs'],check=True)
          # Validate the exact reviewed source independently of this retained CI tool.
          subprocess.run(['git','rm','--cached','--',workflow],check=True)
          source_tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert source_tree == manifest['source_result_tree']
          subprocess.run(['git','add','--',workflow],check=True)
          candidate_tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          out.joinpath('expected-tree.txt').write_text(candidate_tree+'\n')
          out.joinpath('reviewed-source-tree.txt').write_text(source_tree+'\n')
          out.joinpath('verified-unit.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Install supported CPU verification runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.0' 'pyright==1.1.411' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15'
      - name: Run source-owned static and production regression checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_structural_rebuild.sh "$RUNNER_TEMP/m1c-report"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/m1c-report/expected-tree.txt")"
      - name: Publish only by normal fast-forward on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=refs/heads/codex/structural-rebuild-20260921
          test "$(git ls-remote origin "$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: M1c native state and rotation-column feature separation' -m 'Hash-verified M1c source; source-owned CPU regression and static delta. Native seven-dimensional normalizers and actions remain separate from ten-dimensional CALVIN model state. No checkpoint migration or formal robot training. The publisher workflow is retained unchanged, not removed by an Actions token.'
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/m1c-report/expected-tree.txt")"
          git push origin HEAD:"$BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/m1c-report/published-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/m1c-report/published-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-m1c-${{ github.sha }}
          path: ${{ runner.temp }}/m1c-report
          retention-days: 14
          if-no-files-found: error
