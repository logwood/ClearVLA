name: Causal unified refactor audit

on:
  push:
    branches: [codex/causal-unified-refactor-20261008]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: causal-unified-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-source-and-backward:
    if: github.repository == 'logwood/ClearVLA'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact audited source before executing checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/causal-audit/source" "$RUNNER_TEMP/causal-audit/results"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/causal-audit/source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/causal-audit/source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/causal-audit/source/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/causal-audit/source/files.txt"
          python -m compileall -q clearvla tests scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: causal-source-${{ github.sha }}
          path: ${{ runner.temp }}/causal-audit/source
          retention-days: 7
          if-no-files-found: error
      - name: Install declared CPU test runtime
        run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15' 'opencv-python-headless>=4.9,<6' 'ruff==0.16.0'
      - name: Record actual runtime and run numerical and integration regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/causal-audit/results/runtime.json"
          import json, platform, torch
          print(json.dumps({'python': platform.python_version(), 'torch': torch.__version__, 'cuda_available': torch.cuda.is_available(), 'scope': 'CPU source/component/model fixtures; not private-data training or learned rollout acceptance'}, indent=2))
          PY
          if test -f scripts/run_unified_refactor_checks.py; then
            python scripts/run_unified_refactor_checks.py --output "$RUNNER_TEMP/causal-audit/results"
          else
            python -m pytest -q tests/test_log_transport_adjoint.py tests/test_canonical_transport.py tests/test_full_token_binding.py tests/test_identity_supervision.py tests/test_identity_null_escape.py tests/test_source_consistent_measurement.py tests/test_observed_correspondence.py tests/test_causal_identity_contract.py tests/test_causal_chain_integration.py tests/test_causal_stage2_integration.py --junitxml="$RUNNER_TEMP/causal-audit/results/baseline.xml" 2>&1 | tee "$RUNNER_TEMP/causal-audit/results/baseline.log"
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: causal-tests-${{ github.sha }}
          path: ${{ runner.temp }}/causal-audit/results
          retention-days: 14
          if-no-files-found: warn
