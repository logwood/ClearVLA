name: Integration audit

on:
  push:
    branches: [codex/integrated-mainline-20260917]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: integration-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact branch provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clearvla-audit"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          head = git('rev-parse', 'HEAD')
          refs = git('for-each-ref', '--format=%(refname:short)', 'refs/remotes/origin').splitlines()
          rows = []
          for ref in refs:
              if ref == 'origin/HEAD':
                  continue
              sha = git('rev-parse', ref)
              counts = git('rev-list', '--left-right', '--count', f'{head}...{sha}').split()
              rows.append({
                  'ref': ref,
                  'sha': sha,
                  'head_only_commits': int(counts[0]),
                  'branch_only_commits': int(counts[1]),
                  'merge_base': git('merge-base', head, sha),
                  'tip': git('show', '-s', '--format=%cI %s', sha),
              })
          report = {'audited_head': head, 'branches': rows}
          path = Path(os.environ['RUNNER_TEMP']) / 'clearvla-audit' / 'provenance.json'
          path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
          git bundle create "$RUNNER_TEMP/clearvla-audit/source.bundle" --all
      - name: Compile Python sources
        run: python -m compileall -q clearvla scripts tests
      - name: Upload short-lived review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-${{ github.sha }}
          path: ${{ runner.temp }}/clearvla-audit/
          retention-days: 1
          if-no-files-found: error

  portable-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only contract-test environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.11,<2.12'
          python -m pip install 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'pytest>=8,<10' 'rich>=13,<15'
          python -m pip freeze > test-environment.txt
      - name: Run portable regression tests (not a CUDA or behavior release gate)
        run: |
          python -m pytest -q --junitxml=integration-tests.xml \
            tests/test_audit_policy_logs.py \
            tests/test_probe_flow_dino_dataset_motion.py \
            tests/test_physical_action_codec.py \
            tests/test_temporal_dct.py \
            tests/test_mainline_config.py \
            tests/test_mainline_action_field.py \
            tests/test_calvin_object_binding.py \
            tests/test_window_boundaries.py \
            tests/test_training_batch_prefetch.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-${{ github.sha }}
          path: |
            integration-tests.xml
            test-environment.txt
          retention-days: 7
          if-no-files-found: warn
