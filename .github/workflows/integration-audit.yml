name: Integration audit

on:
  push:
    branches: [codex/integrated-mainline-20260917]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: integration-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [mainline, numerics]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU contract environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.11,<2.12'
          python -m pip install 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'pytest>=8,<10' 'rich>=13,<15'
          python -m pip freeze > test-environment.txt
      - name: Record exact provenance (not behavior evidence)
        run: |
          python scripts/audit_repository_convergence.py --base HEAD --format json > integration-provenance.json
          git rev-parse HEAD > tested-commit.txt
      - name: Compile source and run contracts
        run: |
          python -m compileall -q clearvla scripts tests
          python scripts/check_integration.py --suite '${{ matrix.suite }}' --junitxml integration-tests.xml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.suite }}-${{ github.sha }}
          path: |
            integration-tests.xml
            test-environment.txt
            integration-provenance.json
            tested-commit.txt
          retention-days: 14
          if-no-files-found: warn
