name: Verify and publish recovered M1b
on:
  push:
    branches: [codex/structural-rebuild-20260921]
    paths: [.github/m1b-transport/manifest.json]
permissions:
  contents: write
concurrency:
  group: structural-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/structural-rebuild-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply only the verified recovered source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1b-report"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          manifest_path = '.github/m1b-transport/manifest.json'
          manifest = json.loads(pathlib.Path(manifest_path).read_text())
          base = '329819bb12008d8ccf6211350bc64a8d8a4d7de1'
          expected_tree = '632c4c0edd41c5adc22fca3a0fe9b41e64343f13'
          assert manifest['schema'] == 'verified-m1b-patch-v1'
          assert manifest['base'] == base and manifest['result_tree'] == expected_tree
          assert subprocess.check_output(['git','rev-parse',base+'^{tree}'],text=True).strip() == manifest['base_tree']
          parts = manifest['parts']
          assert len(parts) == 14
          transport = [manifest_path, '.github/workflows/structural-publish-m1b.yml']
          encoded_parts = []
          for i, part in enumerate(parts):
              path = f'.github/m1b-transport/part-{i:02d}.txt'
              assert part['index'] == i and part['path'] == path
              raw = pathlib.Path(path).read_bytes()
              assert len(raw) == part['length'] and len(raw) <= 4000
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest() == part['blob_sha']
              encoded_parts.append(raw)
              transport.append(path)
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()) == set(transport)
          compressed = base64.b64decode(b''.join(encoded_parts),validate=True)
          assert hashlib.sha256(compressed).hexdigest() == manifest['xz_sha256']
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(compressed,max_length=2000000)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == manifest['patch_bytes'] and len(patch) < 2000000
          assert hashlib.sha256(patch).hexdigest() == manifest['patch_sha256']
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  for value in line.split()[2:]:
                      p = pathlib.PurePosixPath(value)
                      assert not p.is_absolute() and '..' not in p.parts
                      assert p.parts[0] in {'a','b'} and p.parts[1] in {'clearvla','tests','scripts','docs','configs'}
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','rm','--',*transport],check=True)
          subprocess.run(['git','add','--','clearvla','tests','scripts','docs','configs'],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == expected_tree
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'m1b-report'
          (out/'expected-tree.txt').write_text(tree+'\n')
          (out/'verified-recovery.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (out/'transport-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - name: Install project-compatible verification runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.0' 'pyright==1.1.411' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15'
      - name: Verify real production tests and diagnostic delta
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_structural_rebuild.sh "$RUNNER_TEMP/m1b-report"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/m1b-report/expected-tree.txt")"
      - name: Commit and fast-forward the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish M1b observed-tail support across targets and policy losses' -m 'Recovered 27-file source unit with exact before/after tree verification and project-runtime regression. Independent real action/state/visual label support; unavailable flow targets retain source noise. No formal training, checkpoint migration, or later G/S/W/P completion claim.'
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/m1b-report/expected-tree.txt")"
          git push origin HEAD:refs/heads/codex/structural-rebuild-20260921
          git rev-parse HEAD > "$RUNNER_TEMP/m1b-report/published-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/m1b-report/published-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-m1b-${{ github.sha }}
          path: ${{ runner.temp }}/m1b-report
          retention-days: 14
          if-no-files-found: error
