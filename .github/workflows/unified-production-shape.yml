name: Unified production-shape integration
on:
  push:
    branches: [codex/causal-unified-refactor-20261008]
    paths: [.github/workflows/unified-production-shape.yml]
permissions:
  contents: read
jobs:
  production-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15' 'opencv-python-headless>=4.9,<5'
      - name: Run full-width ordinary train and sampled action with artificial inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-shape"
          git rev-parse HEAD > "$RUNNER_TEMP/production-shape/source.txt"
          python scripts/check_unified_model_flow.py --shape production --variant ${{ matrix.variant }} --updates 2 --raw-side 32 --output "$RUNNER_TEMP/production-shape/result.json" 2>&1 | tee "$RUNNER_TEMP/production-shape/execution.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-production-shape-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/production-shape
          retention-days: 14
