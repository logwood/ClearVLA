name: Unified production-shape integration
on:
  push:
    branches: [codex/causal-unified-refactor-20261008]
    paths: [.github/workflows/unified-production-shape.yml]
permissions:
  contents: read
jobs:
  production-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10' 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'rich>=13,<15' 'opencv-python-headless>=4.9,<5'
      - name: Full-width conditional-value training and two-pass sampling with artificial inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-shape"
          git rev-parse HEAD > "$RUNNER_TEMP/production-shape/source.txt"
          python scripts/check_unified_model_flow.py --shape production --variant ${{ matrix.variant }} --updates 2 --raw-side 336 --completed-step 1200 --typed-object-values conditional_object_v1 --output "$RUNNER_TEMP/production-shape/result.json" 2>&1 | tee "$RUNNER_TEMP/production-shape/execution.log"
      - name: Real-data admission remains separate from synthetic integration
        if: always()
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-shape"
          set +e
          python scripts/run_unified_real_data_check.py --config "configs/mainline/unified_values_${VARIANT,,}_calvin_check.json" --migration causal_unified_values_v1 --checkpoint /data/senwang/clearvla/checkpoints/mature-source.pt --output-dir "$RUNNER_TEMP/not-a-real-training-run" --report "$RUNNER_TEMP/production-shape/real-data-admission.json" --device cuda:0
          code=$?
          test "$code" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-production-shape-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/production-shape
          retention-days: 14
