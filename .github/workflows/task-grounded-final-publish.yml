name: Preserve reviewed M9d source
on:
  push:
    branches: [codex/task-grounded-execution-20260928]
    paths: [.github/workflows/task-grounded-final-publish.yml]
permissions:
  contents: write
concurrency:
  group: task-grounded-final-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'logwood/ClearVLA' && github.ref == 'refs/heads/codex/task-grounded-execution-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Check reviewed patch and exact resulting tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess
          def git(*a, **kw):
              return subprocess.check_output(['git', *a], **kw)
          branch = 'codex/task-grounded-execution-20260928'
          base = '8ca4451c160ccd2e5a6d21c78c8c416f58b421d1'
          expected = 'd4a4cc440380fa0a29d0c2e1d18b940bc8a23947'
          workflow = '.github/workflows/task-grounded-final-publish.yml'
          transport = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF'] == 'refs/heads/'+branch
          assert git('rev-parse','HEAD',text=True).strip() == transport
          assert git('rev-parse','HEAD^',text=True).strip() == base
          assert git('rev-parse',base+'^{tree}',text=True).strip() == 'a39ca95ebc689299871470d9924a46aec4da3a26'
          assert not git('status','--porcelain',text=True).strip()
          parts = [f'.github/task-grounded-final/part-{i}.txt' for i in range(3)]
          assert set(git('diff','--name-only',base,'HEAD',text=True).splitlines()) == set(parts+[workflow])
          data = b''.join(pathlib.Path(p).read_bytes() for p in parts)
          assert len(data) == 8600
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(base64.b64decode(data,validate=True),max_length=1000000)
          assert decoder.eof and not decoder.unused_data and len(patch) == 22420
          assert hashlib.sha256(patch).hexdigest() == 'f1d180d8a879f7fc3e4ed50af90bbdd92bb9c28e0bb987ce5672d4ac370b12d5'
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  _,_,a,b = line.split()
                  assert a.startswith('a/') and b == 'b/'+a[2:]
                  path = pathlib.PurePosixPath(a[2:])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] in {'clearvla','tests','docs'}
          git('apply','--check','--index','-',input=patch)
          git('apply','--index','-',input=patch)
          git('rm','--',*parts)
          index = pathlib.Path(git('rev-parse','--git-path','index',text=True).strip()).resolve()
          clean = pathlib.Path(os.environ['RUNNER_TEMP'])/'clean-final.index'
          shutil.copyfile(index,clean)
          env = dict(os.environ,GIT_INDEX_FILE=str(clean))
          git('rm','--cached','--',workflow,env=env)
          assert git('write-tree',env=env,text=True).strip() == expected
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(M9d): source-only task values and pre-projection support isolation\n\nRecovered and independently checked follow-up patch. Source-only task reads remove query residual/FFN value bypasses; joint comparison quarantines unavailable sources before parameter VJPs; exact current-observation provenance and cumulative composition tests included. Source tree '+expected+'. This publisher verifies source only, not tests, CUDA or learned closed-loop behavior. Temporary workflow removed separately.')
          remote = git('ls-remote','--heads','origin','refs/heads/'+branch,text=True).split()[0]
          assert remote == transport, 'Concurrent changes: refuse to overwrite'
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Verified source tree',expected)
          PY
