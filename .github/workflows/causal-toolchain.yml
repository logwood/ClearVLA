name: Causal static toolchain
on:
  push:
    branches: [codex/causal-unified-refactor-20261008]
    paths: [.github/workflows/causal-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download versioned review tools, not datasets or weights
        run: |
          mkdir -p "$RUNNER_TEMP/static-wheels"
          python -m pip download 'ruff==0.16.0' 'pyright==1.1.411' 'nodeenv==1.9.1' 'typing_extensions==4.15.0' --dest "$RUNNER_TEMP/static-wheels"
          cd "$RUNNER_TEMP/static-wheels"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: causal-static-toolchain
          path: ${{ runner.temp }}/static-wheels
          retention-days: 7
