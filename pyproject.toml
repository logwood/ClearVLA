[project]
name = "clearvla"
version = "0.1.0"
description = "ClearVLA policy research workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h5py>=3.10,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "torch>=2.11,<2.12",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8,<4",
]
reference-models = [
  "diffusers>=0.30,<1",
  "transformers>=4.45,<5",
]
vision = [
  "opencv-python-headless>=4.9,<5",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390,<2",
  "pytest>=8,<10",
  "rich>=13,<15",
  "ruff>=0.8,<1",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"
